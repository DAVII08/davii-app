<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Auth Callback</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
           max-width: 600px; margin: 80px auto; padding: 0 24px;
           color: #1a1a1a; text-align: center; }
    .box { background: #f0f9ff; border: 2px solid #0ea5e9; border-radius: 12px;
           padding: 32px; margin-top: 32px; }
    .code { font-family: 'Consolas', monospace; font-size: 15px;
            background: #1e1e1e; color: #4ade80; padding: 16px 20px;
            border-radius: 8px; word-break: break-all;
            margin: 16px 0; text-align: left; }
    button { background: #0ea5e9; color: #fff; border: none; padding: 12px 28px;
             border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 8px; }
    button:hover { background: #0284c7; }
    .error { background: #fef2f2; border-color: #f87171; }
    .error .code { color: #f87171; }
    h2 { margin-bottom: 8px; }
    p { color: #666; font-size: 14px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>TikTok Authorization</h1>
  <div id="result" class="box">
    <p>Reading authorization code...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const box = document.getElementById('result');

    if (code) {
      box.innerHTML = `
        <h2>✅ Authorization Successful</h2>
        <p>Copy the code below and paste it to Claude:</p>
        <div class="code" id="code-box">${code}</div>
        <button onclick="copyCode()">Copy Code</button>
      `;
    } else if (error) {
      box.className = 'box error';
      box.innerHTML = `
        <h2>❌ Authorization Failed</h2>
        <div class="code">${error}: ${params.get('error_description') || ''}</div>
        <p>Close this tab and try again.</p>
      `;
    } else {
      box.innerHTML = `
        <h2>⚠️ No code found</h2>
        <p>This page should only be opened by TikTok's OAuth redirect.<br>
           Copy the full URL from the address bar and send to Claude.</p>
        <div class="code">${window.location.href}</div>
      `;
    }

    function copyCode() {
      const code = document.getElementById('code-box').innerText;
      navigator.clipboard.writeText(code).then(() => {
        document.querySelector('button').innerText = '✅ Copied!';
        setTimeout(() => document.querySelector('button').innerText = 'Copy Code', 2000);
      });
    }
  </script>
</body>
</html>
